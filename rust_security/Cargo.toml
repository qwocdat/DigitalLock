[package]
name = "digitallock_security"
version = "2.0.0"
edition = "2021"
description = "Memory-safe Rust cryptographic verification & integrity engine for DigitalLock Android"

[lib]
name = "digitallock_security"
crate-type = ["cdylib"]

[dependencies]
jni = { version = "0.21", default-features = false }
sha2 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast"] }
base64 = "0.22"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
