name: Build DigitalLock Liquid Glass APK

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Verified Source Tree & Gradle Configuration
        shell: bash
        run: |
          set -e
          rm -rf app/src/main/java DigitalLockComplete.kt
          mkdir -p app/src/main/res/xml app/src/main/res/values native/include native/src native/shaders

          # Unpack verified app/src/main/java tree (includes MiuixBlurCompat, fixed PinGlassRenderer, fixed HomeScreen)
          echo "" | base64 -d | tar -xzf -

          cat << 'EOF_SETTINGS' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DigitalLock"
          include(":app")
          EOF_SETTINGS

          cat << 'EOF_PROPS' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_PROPS

          cat << 'EOF_ROOT_GRADLE' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF_ROOT_GRADLE

          cat << 'EOF_APP_GRADLE' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.digitallock"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.digitallock"
                  minSdk = 33
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"

                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++20 -O3 -Wall"
                          arguments += "-DANDROID_STL=c++_shared"
                      }
                  }
                  ndk {
                      abiFilters += listOf("arm64-v8a", "x86_64")
                  }
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }

              externalNativeBuild {
                  cmake {
                      path = file("../native/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.fragment:fragment-ktx:1.8.5")
              implementation(platform("androidx.compose:compose-bom:2024.11.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.biometric:biometric:1.1.0")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF_APP_GRADLE

          cat << 'EOF_MANIFEST' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="false"
                  android:directBootAware="true"
                  android:icon="@android:drawable/ic_lock_idle_lock"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.DigitalLock">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".lock.LockActivity"
                      android:directBootAware="true"
                      android:excludeFromRecents="true"
                      android:exported="false"
                      android:launchMode="singleInstance"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:taskAffinity="com.digitallock.locktask"
                      android:theme="@style/Theme.DigitalLock.LockScreen" />

                  <service
                      android:name=".service.MonitorService"
                      android:directBootAware="true"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="specialUse|mediaProjection">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Screen state event monitoring for user-configured DigitalLock PIN session protection" />
                  </service>

                  <service
                      android:name=".accessibility.AccessibilityMonitor"
                      android:directBootAware="true"
                      android:exported="false"
                      android:label="@string/accessibility_service_label"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <receiver
                      android:name=".receiver.BootReceiver"
                      android:directBootAware="true"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>

                  <receiver
                      android:name=".receiver.DigitalLockDeviceAdminReceiver"
                      android:description="@string/device_admin_description"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_DEVICE_ADMIN">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin_policies" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          EOF_MANIFEST

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled DigitalLock APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitalLock-LiquidGlass-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
